[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ops-site"
version = "0.1.0.dev1"
description = "AI Ops official website + membership backend (courses & Skills hub)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
ai-ops-site = "ai_ops_site.__main__:main"

[tool.setuptools.packages.find]
include = ["ai_ops_site*"]

[tool.setuptools.package-data]
"ai_ops_site" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
